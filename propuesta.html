*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#8F00FF;--accent-text:#7A00DB;--page:#F5F6F8;--surface:#FFFFFF;--ink:#14181D;--body:#3A414A;--muted:#626A74;--hair:#DEE2E7;--hair2:#ECEFF3;--well:#F7F8FA;
 --bar:#B98BFF;--bar-off:#E6D8FF;--bar-3:#8F00FF;--spark-fill:rgba(143,0,255,.06);--ok:#0F7A5A;--warn-fill:#B26B00;--crit:#C22E2E;
 --fd:"Clash Display","Arial Black",system-ui,sans-serif;--fb:"Open Sauce One",-apple-system,"Segoe UI",system-ui,sans-serif;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--t-state:200ms;--ease:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#B45BFF;--accent-text:#C58BFF;--page:#0E1218;--surface:#151B23;--ink:#E8ECF1;--body:#C3CAD3;--muted:#8A939E;--hair:#263040;--hair2:#1D2631;--well:#182029;
 --bar:#8A5BD0;--bar-off:#3A2B57;--bar-3:#B45BFF;--spark-fill:rgba(180,91,255,.08);--ok:#5DD5AA;--warn-fill:#E0A33F;--crit:#FF7B7B}}
:root[data-theme="dark"]{--accent:#B45BFF;--accent-text:#C58BFF;--page:#0E1218;--surface:#151B23;--ink:#E8ECF1;--body:#C3CAD3;--muted:#8A939E;--hair:#263040;--hair2:#1D2631;--well:#182029;
 --bar:#8A5BD0;--bar-off:#3A2B57;--bar-3:#B45BFF;--spark-fill:rgba(180,91,255,.08);--ok:#5DD5AA;--warn-fill:#E0A33F;--crit:#FF7B7B}
html{background:var(--page)}
body{background:var(--page);color:var(--body);font:13.5px/1.5 var(--fb);font-variant-numeric:tabular-nums;padding:var(--s4);-webkit-font-smoothing:antialiased}
@media(min-width:900px){body{padding:var(--s5) var(--s6)}}
.doc{max-width:1320px;margin:0 auto}
/* cabecera: titular como único foco */
.top{display:grid;gap:6px;margin-bottom:var(--s3)}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--hair)}
.logo{width:124px;height:auto;display:block;margin-bottom:2px}
.topbar .cap{font-size:12px;color:var(--muted)}
.h1{font:600 22px/1.18 var(--fd);letter-spacing:-.02em;color:var(--ink);text-wrap:balance} @media(min-width:600px){.h1{font-size:26px;line-height:1.15}}
@media(min-width:900px){.h1{font-size:27px;line-height:1.12;letter-spacing:-.025em}}
.meta{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);align-items:center;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;color:var(--muted)} .pill i{width:6px;height:6px;border-radius:50%;background:var(--muted)} .pill.live i{background:var(--ok)} .pill.warn i{background:var(--warn-fill)}
/* selector: el acento vive aquí (1 de 3) */
.seg{display:flex;border:1px solid var(--hair);border-radius:3px;background:transparent;overflow:hidden;width:max-content;max-width:100%}
.seg button{font:500 12.5px/1 var(--fb);min-height:44px;padding:0 var(--s4);border:0;background:transparent;color:var(--body);cursor:pointer;border-right:1px solid var(--hair);transition:background var(--t-state),color var(--t-state);white-space:nowrap}
.seg button:last-child{border-right:0} .seg button:hover{background:var(--well);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent-text);outline-offset:-2px;z-index:1}
@media(max-width:600px){.seg{width:100%}.seg button{flex:1;padding:0 var(--s2)}}
.cap{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.3}
/* capa 1: una hoja, celdas separadas por hairlines */
.mos{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair);grid-template-columns:1fr;margin-bottom:var(--s6);align-items:stretch}
@media(min-width:640px){.mos{grid-template-columns:repeat(2,1fr);grid-auto-flow:dense}.t2,.t3{grid-column:span 2}}
@media(min-width:1024px){.mos{grid-template-columns:repeat(6,1fr);grid-auto-flow:dense}.t2{grid-column:span 2}.t3{grid-column:span 3}}
.tile{container-type:inline-size;background:var(--surface);padding:12px 18px 10px;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;position:relative}
.tile>*{flex:none}
.tile .q{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.tile .cap b{color:var(--muted);font-weight:500;opacity:.7;margin-right:6px}
.tile .n{font:600 22px/1.05 var(--fd);letter-spacing:-.02em;color:var(--ink);margin-top:var(--s1)}
.tile.big .n{font-size:38px;letter-spacing:-.03em} .tile.mid .n{font-size:28px}
.tile .n small{font:500 12px/1 var(--fb);color:var(--muted);margin-left:4px;letter-spacing:0}
.tile .c{font-size:12.5px;color:var(--body);display:flex;align-items:center;gap:6px;flex-wrap:wrap} .tile .c b{color:var(--ink);font-weight:600}
.tile .f{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px} .tile .f b{color:var(--body);font-weight:600}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;flex:none}
.st i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted)}
.st.ok i{background:var(--ok)} .st.ambar i{background:var(--warn-fill)} .st.rojo i{background:var(--crit)}
.sd{font-weight:500;color:var(--body)}
.sp{display:block;width:100%;height:40px;margin-top:var(--s1)} .tile.acc .sp{height:32px} .sp .area{fill:var(--spark-fill)} .sp .line{fill:none;stroke:var(--bar);stroke-width:2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0} .sp .dot{fill:var(--bar-3)}
.tile.acc .sp .line{stroke:var(--accent)} .tile.acc .sp .dot{fill:var(--accent)}
.spl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px} .spl b{color:var(--ink);font-weight:600}
.stack{display:flex;height:8px;background:var(--hair2);margin-top:var(--s2)} .stack i{display:block;height:100%}
.stack .a{background:var(--bar-3)} .stack .b{background:var(--bar)} .stack .cc{background:var(--bar-off)} .stack .d{background:var(--hair)}
.leg{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);font-size:12px;color:var(--muted);margin-top:var(--s1)} .leg span{display:inline-flex;align-items:center;gap:5px} .leg i{width:10px;height:3px;display:inline-block} .leg b{color:var(--ink);font-weight:600}
.leg .a{background:var(--bar-3)} .leg .b{background:var(--bar)} .leg .cc{background:var(--bar-off)} .leg .d{background:var(--hair)}
.rows{display:grid;margin-top:var(--s3)}
.rw{display:grid;align-items:center;gap:var(--s2);padding:3px 0;border-bottom:1px solid var(--hair2);font-size:12.5px;white-space:nowrap}
